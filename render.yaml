# Render Blueprint for StudyVault. Review billing, domains, email, and backups before applying.
# This is paid infrastructure configuration only; committing this file does not deploy services.
# Review the estimated recurring charges on Render before approving Blueprint creation.
# The existing legacy service named StudyVault is deliberately left unchanged.
services:
  - type: web
    name: studyvault-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    repo: https://github.com/chetan5702/StudyVault
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: alembic upgrade head
    healthCheckPath: /ready
    disk:
      name: studyvault-uploads
      mountPath: /srv/data/uploads
      sizeGB: 5
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STUDYVAULT_DEBUG
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: studyvault-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /srv/data/uploads
      - key: PUBLIC_FRONTEND_URL
        value: https://studyvault-frontend.vercel.app
      - key: CORS_ORIGINS
        value: https://studyvault-frontend.vercel.app
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: PUBLIC_AUTH_LIMIT_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: worker
    name: studyvault-reminders
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    repo: https://github.com/chetan5702/StudyVault
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.reminder_worker --interval 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STUDYVAULT_DEBUG
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: studyvault-postgres
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: studyvault-api
          envVarKey: SECRET_KEY
      - key: PUBLIC_FRONTEND_URL
        value: https://studyvault-frontend.vercel.app
      - key: CORS_ORIGINS
        value: https://studyvault-frontend.vercel.app
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: PUBLIC_AUTH_LIMIT_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: studyvault-api
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          type: web
          name: studyvault-api
          envVarKey: EMAIL_FROM

databases:
  - name: studyvault-postgres
    databaseName: studyvault
    user: studyvault
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
