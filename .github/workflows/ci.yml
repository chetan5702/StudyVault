name: StudyVault CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check app tools tests alembic

  postgres_migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studyvault_ci
          POSTGRES_USER: studyvault
          POSTGRES_PASSWORD: studyvault_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyvault -d studyvault_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://studyvault:studyvault_ci_only@localhost:5432/studyvault_ci
      STORAGE_BACKEND: local
      REGISTRATION_EMAIL_DOMAIN: ""
      SEED_DEMO: "false"
      STUDYVAULT_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run all Alembic migrations on PostgreSQL 16
        run: python -m alembic upgrade head
      - name: Validate migration revision and database readiness
        run: |
          python -m alembic check
          python -c "from fastapi.testclient import TestClient; from app.main import app; client=TestClient(app); response=client.get('/ready'); assert response.status_code == 200, response.text; assert response.json()['status'] == 'ready'"
      - name: Confirm idempotent migration execution
        run: python -m alembic upgrade head
      - name: PostgreSQL API acceptance suite (isolated database)
        run: python -m tools.postgres_acceptance_check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps msedge
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production.example -f compose.prod.yml config --quiet
      - run: docker compose --env-file .env.production.example -f compose.prod.yml build
