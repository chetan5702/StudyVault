name: StudyVault CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check app tools tests alembic
      - run: python -m pytest -q


  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studyvault_ci
          POSTGRES_USER: studyvault_ci
          POSTGRES_PASSWORD: ci-only-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyvault_ci -d studyvault_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://studyvault_ci:ci-only-not-for-production@127.0.0.1:5432/studyvault_ci
      ENVIRONMENT: test
      SEED_DEMO: "false"
      SECRET_KEY: ci-isolated-only-random-value-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test PostgreSQL upgrade and rollback
        run: |
          python -m alembic upgrade 0007_public_limits_and_membership
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade 0007_public_limits_and_membership
          python -m alembic upgrade head
          python -m alembic check
          python -c "from sqlalchemy import create_engine,text; from app.config import get_settings; e=create_engine(get_settings().database_url); c=e.connect(); assert c.execute(text('SELECT version_num FROM alembic_version')).scalar_one() == '0008_academic_cohorts'; assert c.execute(text(\"SELECT count(*) FROM departments WHERE code='CSE'\")).scalar_one() == 1; c.close(); e.dispose()"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps msedge
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Preserve Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build-only environment
        run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production.example -f compose.prod.yml config --quiet
      - run: docker compose --env-file .env.production.example -f compose.prod.yml build
