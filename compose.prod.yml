name: studyvault
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyvault
      POSTGRES_USER: studyvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyvault -d studyvault"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    image: studyvault-backend:local
    restart: "no"
    env_file: .env.production
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://studyvault:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/studyvault
      UPLOAD_DIR: /srv/data/uploads
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  api:
    image: studyvault-backend:local
    restart: unless-stopped
    env_file: .env.production
    environment: *backend_environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - uploads:/srv/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  worker:
    image: studyvault-backend:local
    restart: unless-stopped
    env_file: .env.production
    environment: *backend_environment
    command: ["python", "-m", "app.reminder_worker", "--interval", "30"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build: ./frontend
    image: studyvault-frontend:local
    restart: unless-stopped
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env.production
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [private]
    security_opt: ["no-new-privileges:true"]

networks:
  private:
    driver: bridge

volumes:
  pgdata:
    name: studyvault_pgdata
  uploads:
    name: studyvault_uploads
  caddy_data:
    name: studyvault_caddy_data
  caddy_config:
    name: studyvault_caddy_config
