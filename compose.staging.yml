# Local-only integration test. Not a production configuration.
# Uses existing studyvault-backend:staging and studyvault-frontend:staging images.
name: studyvault-staging

x-backend-environment: &backend_environment
  ENVIRONMENT: development
  STUDYVAULT_DEBUG: "false"
  SEED_DEMO: "false"
  REQUIRE_EMAIL_VERIFICATION: "false"
  EMAIL_PROVIDER: disabled
  SECRET_KEY: ${STAGING_SECRET_KEY:?Generate STAGING_SECRET_KEY in .env.staging}
  DATABASE_URL: postgresql+psycopg://studyvault:${STAGING_DB_PASSWORD:?Generate STAGING_DB_PASSWORD in .env.staging}@postgres:5432/studyvault
  PUBLIC_FRONTEND_URL: http://127.0.0.1:18080
  CORS_ORIGINS: http://127.0.0.1:18080
  UPLOAD_DIR: /srv/data/uploads
  PUBLIC_AUTH_LIMIT_ENABLED: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyvault
      POSTGRES_USER: studyvault
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Generate STAGING_DB_PASSWORD in .env.staging}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyvault -d studyvault"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  migrate:
    image: studyvault-backend:staging
    environment: *backend_environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    image: studyvault-backend:staging
    environment: *backend_environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/srv/data/uploads
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks: [private]

  worker:
    image: studyvault-backend:staging
    environment: *backend_environment
    command: ["python", "-m", "app.reminder_worker", "--interval", "30"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [private]

  web:
    image: studyvault-frontend:staging
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    networks: [private]

  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./deploy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  pgdata:
    name: studyvault_staging_pgdata
  uploads:
    name: studyvault_staging_uploads
