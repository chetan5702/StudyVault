spring.application.name=StudyVault

# --- Database -----------------------------------------------------------
# Every value falls back to a local MySQL default and is overridden by an
# environment variable in deployment. The driver class and the Hibernate
# dialect are deliberately NOT set: Spring and Hibernate both work them out
# from the JDBC URL, so the same build runs on MySQL and PostgreSQL untouched.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studyvault?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- JPA ----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Closes the persistence session when the controller returns, so a template can
# never trigger a surprise query while a page is rendering.
spring.jpa.open-in-view=false

# --- Uploads ------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
# Lets Tomcat drain an oversized upload so the friendly error page can be sent.
server.tomcat.max-swallow-size=30MB

# --- Accounts -----------------------------------------------------------
# Change these before deploying anywhere public.
studyvault.admin.username=${SV_ADMIN_USER:admin}
studyvault.admin.password=${SV_ADMIN_PASSWORD:admin123}
studyvault.student.username=${SV_STUDENT_USER:student}
studyvault.student.password=${SV_STUDENT_PASSWORD:student123}
studyvault.search-result-limit=25
studyvault.snippet-radius=120

# --- Server -------------------------------------------------------------
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
