# --- Database connection (LOCAL development defaults - MySQL via IntelliJ) ---
# On Render, these five lines are overridden automatically by environment
# variables you set in the Render dashboard (SPRING_DATASOURCE_URL, etc.) -
# you do NOT need to edit this file differently for deployment.
spring.datasource.url=jdbc:mysql://localhost:3306/ppt_repo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate ---
# 'update' means Hibernate creates/updates tables automatically to match your entities.
# This is perfect for a college project - no manual SQL table creation needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- File upload limits (adjust if you need bigger PPTs) ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Server port ---
# Render assigns its own port via the PORT environment variable at runtime.
# Locally, no PORT variable exists, so it falls back to 8080 as before.
server.port=${PORT:8080}
