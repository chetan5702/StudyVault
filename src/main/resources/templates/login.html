<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in to StudyVault')}"></head>
<body class="centred">

<main class="login-card">
    <h1>StudyVault</h1>
    <p class="login-note">Sign in to browse and upload your class material.</p>

    <p class="flash flash-error" th:if="${param.error}" role="alert">
        That username and password do not match. Try again.
    </p>
    <p class="flash flash-notice" th:if="${param.logout}" role="status">
        You are signed out.
    </p>

    <form th:action="@{/login}" method="post" class="login-form">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
    </form>
</main>

</body>
</html>
