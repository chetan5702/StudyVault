# Tests run against an in-memory H2 database, so `mvn test` needs no MySQL.
spring.datasource.url=jdbc:h2:mem:studyvault;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
studyvault.admin.password=test-admin-pw
studyvault.student.password=test-student-pw
