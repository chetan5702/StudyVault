[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"] # FastAPI intentionally uses Depends/File as default parameters.

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"] # Set isolated environment before importing the app.
